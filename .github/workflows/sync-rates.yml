name: Daily Exchange Rates Sync

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-rates:
    name: Fetch & Seal Exchange Rates into Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Exchange Rates to Sanity
        working-directory: front-end
        env:
          VITE_SANITY_ID: ${{ secrets.VITE_SANITY_ID }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          EXCHANGE_URL: ${{ secrets.EXCHANGE_URL || 'https://v6.exchangerate-api.com/v6/' }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
        run: node scripts/sync-rates.js
